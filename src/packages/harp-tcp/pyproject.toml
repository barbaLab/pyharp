[project]
name        = "harp-tcp"
dynamic     = ["version"]
description = "TCP transport for Harp devices (ESP32 client-mode target)"
readme      = "README.md"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
    "harp-device",
]

[build-system]
requires      = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../../.."

[tool.setuptools.packages.find]
where = ["src"]
include = ["harp*"]